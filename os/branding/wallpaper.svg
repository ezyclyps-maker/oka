<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.5" stop-color="#0d1233"/>
      <stop offset="1" stop-color="#1a1147"/>
    </linearGradient>
    <linearGradient id="r1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#22d3ee" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#c084fc" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="r3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="softer" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="fine" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="glow" cx="0.72" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#4338ca" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.6" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#base)"/>
  <rect width="2560" height="1440" fill="url(#glow)"/>
  <!-- wide glow behind the ribbons -->
  <path d="M-200 1180 C 500 900, 900 1250, 1400 820 S 2300 300, 2800 420 L 2800 720 C 2300 640, 1900 1000, 1400 1120 S 500 1300, -200 1480 Z" fill="url(#r2)" filter="url(#softer)" opacity="0.75"/>
  <!-- ribbons -->
  <path d="M-200 1120 C 420 880, 860 1200, 1340 800 S 2240 260, 2800 380 L 2800 520 C 2240 440, 1860 880, 1380 1000 S 440 1120, -200 1330 Z" fill="url(#r1)" filter="url(#soft)" opacity="0.9"/>
  <path d="M-200 1260 C 520 1040, 980 1300, 1460 940 S 2300 470, 2800 560 L 2800 660 C 2320 610, 1940 1010, 1480 1100 S 560 1240, -200 1420 Z" fill="url(#r2)" filter="url(#soft)" opacity="0.8"/>
  <path d="M-200 1010 C 380 800, 800 1080, 1260 720 S 2160 150, 2800 250 L 2800 300 C 2180 230, 1760 760, 1290 800 S 400 900, -200 1090 Z" fill="url(#r3)" filter="url(#soft)" opacity="0.7"/>
  <!-- bright thin edges -->
  <path d="M-200 1125 C 420 885, 860 1205, 1340 805 S 2240 265, 2800 385" fill="none" stroke="#a5f3fc" stroke-width="5" filter="url(#fine)" opacity="0.75"/>
  <path d="M-200 1265 C 520 1045, 980 1305, 1460 945 S 2300 475, 2800 565" fill="none" stroke="#e9d5ff" stroke-width="4" filter="url(#fine)" opacity="0.6"/>
  <rect width="2560" height="1440" fill="url(#vig)"/>
</svg>
