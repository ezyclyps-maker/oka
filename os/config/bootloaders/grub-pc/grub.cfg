source /boot/grub/config.cfg

set timeout=5

menuentry "Start Odeifried" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Start Odeifried (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "Firmware settings (UEFI)" --hotkey=f {
		fwsetup
	}
fi
